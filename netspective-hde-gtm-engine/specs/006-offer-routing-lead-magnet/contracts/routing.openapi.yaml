openapi: 3.1.0
info:
  title: GTM Engine API — offer recommendations, routing rule sets and wait-lists
  version: 0.1.0
  description: |
    Offer recommendations for an account and optionally a contact, produced by versioned routing rules after
    deterministic eligibility. Requires offers.read to read, offers.recommend to ask for, accept or dismiss, and
    routing.rules.manage to create or activate a rule set. Nothing here sends a message.
servers:
  - url: /api/v1
security:
  - oidcBearer: []
paths:
  /accounts/{id}/offer-recommendations:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    get:
      operationId: listOfferRecommendations
      summary: "Recommendations for an account, newest first, each with its out-of-date marker."
      responses:
        '200': { description: "Recommendations.", content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recommendOffer
      summary: "Make a new recommendation for the account, and a contact if given. Needs offers.recommend. The earlier ones stay unchanged."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { contactId: { type: string } } } } }
      responses:
        '201': { description: "Made.", content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /offer-recommendations:
    get:
      operationId: listPendingOfferRecommendations
      summary: "The review queue: recommendations still pending, oldest first (follow-ups from downloads land here)."
      parameters:
        - { in: query, name: state, required: false, schema: { type: string, enum: [pending] } }
      responses:
        '200': { description: "Pending recommendations.", content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /offer-recommendations/{id}:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
    get:
      operationId: getOfferRecommendation
      summary: "One recommendation with its eligible and excluded sets, matched rules, alternatives and limitations."
      responses:
        '200': { description: "Recommendation.", content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /offer-recommendations/{id}/review:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
    post:
      operationId: reviewOfferRecommendation
      summary: "Accept or dismiss. Needs offers.recommend. Accepting sends nothing and is refused (capacity_exhausted, contact_suppressed, no_communication_permission) if the situation changed; dismissing needs a reason."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [decision], properties: { decision: { type: string, enum: [accept, dismiss] }, reason: { type: string, minLength: 3, maxLength: 500 } } } } }
      responses:
        '200': { description: "Recorded.", content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /offers/{id}/waitlist:
    parameters: [ { $ref: '#/components/parameters/OfferId' } ]
    get:
      operationId: listWaitlist
      summary: "Waiting entries for the offer, oldest first."
      responses:
        '200': { description: "Entries.", content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WaitlistEntry' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addToWaitlist
      summary: "Add an account and contact to the offer's wait-list. Needs waitlist.edit. Nothing is sent."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [accountId, reason], properties: { accountId: { type: string }, contactId: { type: string }, reason: { type: string, minLength: 3, maxLength: 300 } } } } }
      responses:
        '201': { description: "Added.", content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistEntry' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /offers/{id}/waitlist/{entryId}/close:
    parameters:
      - { $ref: '#/components/parameters/OfferId' }
      - { in: path, name: entryId, required: true, schema: { type: string } }
    post:
      operationId: closeWaitlistEntry
      summary: "Release or remove an entry, with a reason. Needs waitlist.edit."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [state, reason], properties: { state: { type: string, enum: [released, removed] }, reason: { type: string, minLength: 3, maxLength: 300 } } } } }
      responses:
        '200': { description: "Closed.", content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistEntry' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /routing-rule-sets:
    get:
      operationId: listRoutingRuleSets
      summary: "Every version, newest first, with its state."
      responses:
        '200': { description: "Versions.", content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RuleSet' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRoutingRuleSet
      summary: "Create a draft version. Needs routing.rules.manage. The document is validated against the schema."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [rules, reason], properties: { rules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Rule' } }, reason: { type: string, minLength: 3, maxLength: 300 } } } } }
      responses:
        '201': { description: "Draft.", content: { application/json: { schema: { $ref: '#/components/schemas/RuleSet' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /routing-rule-sets/{version}/activate:
    parameters: [ { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } } ]
    post:
      operationId: activateRoutingRuleSet
      summary: "Activate a draft after the case corpus passes. Needs routing.rules.manage (restricted: people only) and a reason. Refused with rules_tests_failed when any case fails."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 300 } } } } }
      responses:
        '200': { description: "Activated.", content: { application/json: { schema: { $ref: '#/components/schemas/RuleSet' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    oidcBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    AccountId: { in: path, name: id, required: true, schema: { type: string } }
    OfferId: { in: path, name: id, required: true, schema: { type: string } }
  responses:
    Problem:
      description: "Problem details with stable codes (contact_suppressed, no_communication_permission, capacity_exhausted, offer_unavailable, rules_tests_failed, invalid_rule_set, stale_recommendation)."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, codes: { type: array, items: { type: string } } }
    Recommendation:
      type: object
      required: [id, accountId, trigger, ruleSetVersion, outcome, outreach, eligible, excluded, matched, explanation, limitations, outOfDate, reviewState, createdAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        contactId: { type: [string, 'null'] }
        trigger: { type: string, enum: [operator, offer5_download] }
        requestId: { type: [string, 'null'] }
        ruleSetVersion: { type: integer }
        outcome: { type: string, enum: [offer, research, no_action] }
        offerId: { type: [string, 'null'] }
        offerKey: { type: [string, 'null'] }
        outreach: { type: string, enum: [allowed, blocked] }
        blockedReasons: { type: array, items: { type: string } }
        eligible: { type: array, items: { type: object, required: [offerKey, reason], properties: { offerKey: { type: string }, reason: { type: string } } } }
        excluded: { type: array, items: { type: object, required: [offerKey, code], properties: { offerKey: { type: string, description: "An offer key, or * when the whole account or contact is blocked." }, code: { type: string } } } }
        matched: { type: array, items: { type: object, required: [ruleId, priority, result], properties: { ruleId: { type: string }, priority: { type: integer }, result: { type: string } } } }
        alternatives: { type: array, items: { type: object, required: [kind, reason], properties: { kind: { type: string, enum: [wait_list, offer, research, do_nothing] }, offerKey: { type: [string, 'null'] }, offerId: { type: [string, 'null'] }, reason: { type: string } } } }
        ranking: { type: [array, 'null'], items: { type: string } }
        aiUsed: { type: boolean }
        aiFallback: { type: boolean }
        explanation: { type: string, maxLength: 600 }
        limitations: { type: array, items: { type: string } }
        outOfDate: { type: boolean }
        reviewState: { type: string, enum: [pending, accepted, dismissed] }
        reviewedBy: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    WaitlistEntry:
      type: object
      required: [id, offerId, accountId, reason, state, addedBy, addedAt]
      properties: { id: { type: string }, offerId: { type: string }, accountId: { type: string }, contactId: { type: [string, 'null'] }, reason: { type: string }, state: { type: string, enum: [waiting, released, removed] }, addedBy: { type: string }, addedAt: { type: string, format: date-time }, closedAt: { type: [string, 'null'], format: date-time } }
    Rule:
      type: object
      additionalProperties: false
      required: [id, priority, description, when, then]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,59}$' }
        priority: { type: integer, minimum: 1, maximum: 1000, description: "The lowest number wins; ties go to the lower rule id." }
        description: { type: string, minLength: 3, maxLength: 300 }
        when:
          type: object
          additionalProperties: false
          properties:
            trigger: { type: string, enum: [operator, offer5_download] }
            icp: { type: string, enum: [icp1, icp2] }
            supportedCategories: { type: array, minItems: 1, items: { type: string } }
            supportedCapability: { type: string }
            distinctCategories: { type: object, additionalProperties: false, required: [capability, count], properties: { capability: { type: string }, count: { type: integer, minimum: 2, maximum: 10 } } }
            fallback: { type: boolean, const: true }
        then:
          type: object
          additionalProperties: false
          properties:
            offerKey: { type: string }
            offerByIcp: { type: object, additionalProperties: false, required: [icp1, icp2], properties: { icp1: { type: string }, icp2: { type: string } } }
            outcome: { type: string, enum: [research, no_action] }
            byFit: { type: boolean, const: true }
    RuleSet:
      type: object
      required: [version, state, rules, author, reason, createdAt]
      properties: { version: { type: integer }, state: { type: string, enum: [draft, active, retired] }, rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }, author: { type: string }, reason: { type: string }, createdAt: { type: string, format: date-time }, activatedBy: { type: [string, 'null'] }, activatedAt: { type: [string, 'null'], format: date-time }, testsPassedAt: { type: [string, 'null'], format: date-time } }

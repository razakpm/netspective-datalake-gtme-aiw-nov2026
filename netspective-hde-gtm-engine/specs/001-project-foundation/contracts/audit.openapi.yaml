openapi: 3.1.0
info:
  title: GTM Engine API — Audit
  version: 0.1.0
  description: |
    Read-only access to the append-only audit trail. Requires the `audit.read` permission. Callers without
    it receive 403 and an audit event with outcome `denied`. There is no operation to create, change or
    delete an audit event through the API (FR-012). Summaries are already redacted when stored and are
    checked again by the PHI guard before they are returned; a summary the guard rejects is returned as
    `{"withheld": true, "rule_ids": [...]}`.
servers:
  - url: /api/v1
security:
  - oidcBearer: []
paths:
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: List audit events, newest first
      tags: [audit]
      parameters:
        - { in: query, name: entityType, schema: { type: string, maxLength: 100 } }
        - { in: query, name: entityId, schema: { type: string, maxLength: 200 } }
        - { in: query, name: actorId, schema: { type: string, maxLength: 200 } }
        - { in: query, name: correlationId, schema: { type: string, maxLength: 64 } }
        - { in: query, name: from, description: Inclusive lower bound on occurredAt, schema: { type: string, format: date-time } }
        - { in: query, name: to, description: Exclusive upper bound on occurredAt, schema: { type: string, format: date-time } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 32 } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  nextCursor:
                    type: [string, 'null']
        '400':
          description: Invalid filter (names fields, never values).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing, invalid or expired token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Caller lacks `audit.read`. An audit event with outcome `denied` is recorded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, entityType, outcome]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: [string, 'null'] }
        actorType: { type: string, enum: [human, ai, system] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        outcome: { type: string, enum: [success, denied, failed] }
        beforeSummary: { type: [object, 'null'] }
        afterSummary: { type: [object, 'null'] }
        correlationId: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, correlationId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
